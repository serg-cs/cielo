[package]
name = "cielo"
version = "1.0.0"
edition = "2024"

[lints.clippy]
pedantic = "deny"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.0"
clap = { version = "4.6.2", features = ["derive"] }
flate2 = "1.1.9"
httpdate = "1.0.3"
include_dir = "0.7.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
html5ever = "0.39.0"
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
markup5ever_rcdom = "0.39.0"
mockito = "1.7.2"
predicates = "3.1.4"
